<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Cash Register</h1>
        <div class="register-display">
            <p>Price: $<span id="price-display">19.50</span></p>
            <div class="cash-drawer">
                <h3>Cash in Drawer:</h3>
                <ul id="cid-display"></ul>
            </div>
        </div>
        <div class="input-group">
            <label for="cash">Customer Cash:</label>
            <input type="number" id="cash" step="0.01" min="0" placeholder="Enter amount">
            <button id="purchase-btn">Purchase</button>
        </div>
        <div id="change-due" class="change-display"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
